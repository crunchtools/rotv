[project]
name = "image-server"
version = "0.1.0"
description = "Lightweight image server with AI captioning and semantic search"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [
    { name = "crunchtools.com" }
]
readme = "README.md"
keywords = ["image-server", "fastapi", "pgvector", "semantic-search", "ai-captioning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "fastembed>=0.4",
    "Pillow>=11.0",
    "python-multipart>=0.0.18",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "C4", "C901", "DTZ", "T10", "ISC", "PIE", "PT", "RET", "SIM", "TID", "TCH", "ARG", "PLC", "PLE", "PLR", "PLW", "TRY", "RUF"]
ignore = [
    "S101",     # assert allowed in tests
    "TRY003",   # long exception messages ok
    "PLR0913",  # many arguments ok for API handlers
    "PLR2004",  # magic numbers ok (HTTP status codes, limits)
    "PLW0603",  # global statement ok for singletons
    "PLC0415",  # imports in functions ok
    "S105",     # hardcoded passwords in tests ok
    "TID252",   # relative imports in package ok
    "RUF022",   # __all__ sorted by category

    # --- reached for the first time under python-sdlc -------------------------
    # `ruff check .` from the repo root now applies THIS config to these files
    # (ruff's config is hierarchical). Nothing linted image-server before, so
    # the 14 findings below are pre-existing. Each is ignored per rule with its
    # count and a reason; none is ignored by path. Tracked in crunchtools/rotv#845.
    "S608",     # 3 -- database.py:249,296,323. Flags the f-string shape, not an
                # injection: every interpolated fragment is a literal built in
                # this module (`set_clauses` from the fixed _UPDATE_FIELD_FORMATTERS
                # table, `conditions` from literal strings), and every VALUE goes
                # through a %(name)s placeholder. Verified line by line.
    "C901",     # 2 -- api.py:93 upload_asset (14 > 10), exif.py:12 extract_exif
                # (11 > 10). Both are flat dispatch over input shapes, where the
                # branch count tracks the number of cases handled.
    "PLR0912",  # 1 -- the same upload_asset, by branches.
    "PLR0915",  # 1 -- the same upload_asset, by statements.
    "S110",     # 1 -- api.py:451. A best-effort cleanup whose failure must not
                # mask the error being handled.
    "S104",     # 1 -- config.py:26. 0.0.0.0 is the bind address for a service
                # that runs in a container; that is the point of it.
    "TC003",    # 1 -- vision.py:6, pathlib.Path used only in annotations.
    "B017",     # 1 -- test_exif.py:22, a deliberately broad raises on a parser
    "PT011",    # 1 -- fed corrupt input; the point is that it does not escape.
    "RUF059",   # 2 -- test_thumbnails.py:60 unpacks a tuple for its shape.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "PLC0415", "PLR2004", "ARG002"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["fastembed", "google", "google.genai", "PIL", "PIL.ExifTags", "pgvector", "pgvector.psycopg"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: downloads the embedding model on first run"]
testpaths = ["tests"]
