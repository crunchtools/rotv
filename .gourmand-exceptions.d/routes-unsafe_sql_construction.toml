check = "unsafe_sql_construction"

[[locations]]
path = "backend/config/userAccount.js"
justification = "findOrCreateUser: the interpolated SET list is built only from hard-coded column fragments ('name = $n', 'is_admin = $n', 'role = $n', 'oauth_credentials = $n', ...); every value, including the id, is pushed to updateValues and bound as $1..$n."
classification = "by_design"

[[locations]]
path = "backend/routes/admin.js"
justification = "Traced every site: PUT /pois/:id, PUT /destinations/:id, POST /destinations, POST /linear-features, PUT /linear-features/:id iterate a local allowedFields string array and only emit those names (req.body keys never reach SQL); PUT /boundaries/:id uses hard-coded 'boundary_type = $n'/'boundary_color = $n'; latestRunFor interpolates type.statusTable from COLLECTION_TYPES in services/collection/registry.js ('news_job_status' | 'trail_status_job_status', null-guarded). All values bound as $1..$n."
classification = "by_design"

[[locations]]
path = "backend/routes/newsletter.js"
justification = "PUT /sources/:pattern: SET list is only the hard-coded fragments 'poi_id = $n', 'status = $n', 'display_name = $n'; the three values and the decoded :pattern are bound parameters."
classification = "by_design"

[[locations]]
path = "backend/routes/trips.js"
justification = "PUT /:id: SET list is only hard-coded fragments ('name = $n', 'description = $n', 'is_public = $n', 'is_featured = $n', 'is_approved = FALSE', 'updated_at = CURRENT_TIMESTAMP'); values and id are bound."
classification = "by_design"

[[locations]]
path = "backend/routes/userSettings.js"
justification = "syncPoiIdList interpolates a table name looked up in the POI_ID_LIST_TABLES constant {favorites: 'user_poi_favorites', visited: 'user_visits'}; both callers pass the literal field names and an unknown key returns early. User id and ids array are bound as $1/$2."
classification = "by_design"

[[locations]]
path = "backend/server.js"
justification = "/api/news/recent, /api/events/upcoming, /api/events/past, /api/events/window interpolate only adminColumns, a hard-coded column list chosen by an isAdmin ternary (or ''). tz/limit/date values are bound parameters."
classification = "by_design"
