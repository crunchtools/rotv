check = "EV010-single_use_helpers"

[[locations]]
path = "frontend/src/components/JobsDashboard.jsx"
justification = "formatTime (ISO -> localized 'Mon D, HH:MM', '--' for null) and formatCronHuman (5-field cron -> 'Daily at 3:00 AM' etc., 19 lines with a nested ordinal helper) are pure module-level formatters called from JSX inside the run-history and scheduled-job lists. They were not extracted to dodge a complexity lint (the caller is an 800-line component render); inlining them into JSX attribute/children expressions would hurt readability."
classification = "by_design"

[[locations]]
path = "frontend/src/components/NavigateButton.jsx"
justification = "buildGoogleMapsUrl has two callers: NavigateButton itself (NavigateButton.jsx:30) and TripBuilder.jsx:26, which imports it on line 4. The detector does not count the cross-file import. Upstream: gitlab.com/mattdm/gourmand#24."
classification = "gourmand_bug"

[[locations]]
path = "frontend/src/components/NotificationBell.jsx"
justification = "timeAgo (relative/future time label, used in the item list JSX) and normalize (maps the news+events feed payload into one sorted item list, used by loadFeed) are pure module-level functions. Keeping them outside the component keeps the render body and the useCallback readable and avoids redefining them each render."
classification = "by_design"
