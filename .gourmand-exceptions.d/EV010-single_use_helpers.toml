check = "EV010-single_use_helpers"

[[locations]]
path = "frontend/src/components/JobsDashboard.jsx"
justification = "formatTime (ISO -> localized 'Mon D, HH:MM', '--' for null) and formatCronHuman (5-field cron -> 'Daily at 3:00 AM' etc., 19 lines with a nested ordinal helper) are pure module-level formatters called from JSX inside the run-history and scheduled-job lists. They were not extracted to dodge a complexity lint (the caller is an 800-line component render); inlining them into JSX attribute/children expressions would hurt readability."
classification = "by_design"

[[locations]]
path = "frontend/src/components/NavigateButton.jsx"
justification = "buildGoogleMapsUrl has two callers: NavigateButton itself (NavigateButton.jsx:30) and TripBuilder.jsx:26, which imports it on line 4. The detector does not count the cross-file import. Upstream: gitlab.com/mattdm/gourmand#24."
classification = "gourmand_bug"

[[locations]]
path = "frontend/src/components/NotificationBell.jsx"
justification = "timeAgo (relative/future time label, used in the item list JSX) and normalize (maps the news+events feed payload into one sorted item list, used by loadFeed) are pure module-level functions. Keeping them outside the component keeps the render body and the useCallback readable and avoids redefining them each render."
classification = "by_design"

[[locations]]
path = "backend/services/passwords.js"
justification = "hashPassword is imported by backend/routes/authAccounts.js and called at three sites there (sign-up, set password, rehash on login), plus the unit tests. The detector does not count cross-file imports. Upstream: gitlab.com/mattdm/gourmand#24."
classification = "gourmand_bug"

[[locations]]
path = "backend/utils/authSession.js"
justification = "stampLogin is imported by backend/routes/auth.js and called from the Google and Facebook OAuth callbacks, where passport has already run req.login, as well as from completeLogin. The detector does not count cross-file imports. Upstream: gitlab.com/mattdm/gourmand#24."
classification = "gourmand_bug"

[[locations]]
path = "frontend/src/components/SeasonalListsSettings.jsx"
justification = "Report, DraftItem and Unmatched are React components rendered from SeasonalListsSettings' JSX. DraftItem and Unmatched hold their own edit state (useState) per row, which cannot be inlined into the parent's map without lifting every row's edits into one object; Report keeps the draft's findings out of the render body."
classification = "by_design"

[[locations]]
path = "backend/services/dedup/normalize.js"
justification = "titleSiteSuffix is also imported by dedup/newsIdentity.js (outletWords drops the outlet's own name from story names), and stripDateline is re-exported by newsletterDigestService.js for its callers and tests. Both are public parts of the shared dedup module (spec 054). The detector does not count cross-file imports. Upstream: gitlab.com/mattdm/gourmand#24."
classification = "gourmand_bug"

[[locations]]
path = "backend/services/dedup/entities.js"
justification = "isTitleCase is part of the dedup module's public surface (re-exported from dedup/index.js) and exercised directly by tests/dedup/normalize.unit.test.js; it names the rule that Title Case headlines carry no name evidence. The detector does not count cross-file imports. Upstream: gitlab.com/mattdm/gourmand#24."
classification = "gourmand_bug"
