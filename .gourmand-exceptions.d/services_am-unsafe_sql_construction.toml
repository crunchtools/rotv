check = "unsafe_sql_construction"

[[locations]]
path = "backend/services/moderationService.js"
justification = "Only identifiers and fixed fragments are interpolated; every value is bound as $n. Table names come from tableFor() (Object.hasOwn over TABLE_MAP {news: 'poi_news', event: 'poi_events', photo: 'poi_media'}, throws on anything else) or from news/event ternaries in functions that first reject other types (poi_news|poi_events, poi_news_urls|poi_event_urls, news_id|event_id). descField, extraFields, titleNorm and dupWhere are ternaries over string constants. editAndPublish SET columns come from the EDITABLE_NEWS/EVENT/PHOTO allowlists; getQueue filters are constant 'col = $n' strings."
classification = "by_design"

[[locations]]
path = "backend/services/mcpServer.js"
justification = "MCP tool args are client input, so none reach SQL text. poi_create's INSERT column list comes from the POI_CREATE_COLUMNS constant, not from the argument keys; values go in as $1..$n. job_logs WHERE clauses are fixed 'job_type|job_id|poi_id|level = $n' strings. poi_update_urls SET clauses are fixed 'news_url|events_url|status_url = $n' strings. All values are bound. The SDK (1.28) also zod-validates args with safeParseAsync before the handler runs."
classification = "by_design"

[[locations]]
path = "backend/services/filterLists.js"
justification = "sweepDenyLists interpolates table.name from a local constant (poi_events|poi_news) and frag.sql from the DENY_LISTS sweepFragment builders. Those builders emit only constant column names (the textCols constant) and $n placeholders. The deny-list values from admin_settings are bound as params: ids via ANY($1), phrases as ILIKE patterns, topic terms regex-escaped into one bound pattern."
classification = "by_design"

[[locations]]
path = "backend/services/jobLogger.js"
justification = "flush() builds a multi-row INSERT. The only interpolation is the VALUES list of generated placeholder tuples ($n..$n+6), and all seven fields of every buffered entry are bound through the values array."
classification = "by_design"
