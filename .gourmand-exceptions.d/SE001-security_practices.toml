check = "SE001-security_practices"

[[locations]]
path = "backend/services/backupService.js"
justification = "triggerBackup and restoreBackup call spawn('pg_dump' | 'psql', [argv array]) with no shell option, so the args are never shell-parsed. The args are -h/-p/-U plus the database name, taken from the PGHOST/PGPORT/PGUSER/PGDATABASE env vars (operator config, defaults localhost/5432/rotv/rotv). No request data reaches argv. Dump data travels only over stdout/stdin. restoreBackup pipes a Drive file into psql, so it first checks the file is a rotv-backup-* dump in the configured backups folder and not trashed (tested in backupAnalytics.unit.test.js); any other file id is refused before psql starts."
classification = "by_design"
