# ============================================================================
# verbose_comments — false positives after removing the blanket disable
#
# Tested on 0.16.5 with the [checks] verbose_comments disable removed. Two
# distinct false-positive patterns surfaced, both reviewed individually:
# 1. "Redundant comment pattern" matched a truncated leading substring
#    ("Validate a", "UPDATE q", "Validate t", "Update d") inside comments
#    that are otherwise substantive (naming a security finding, a ticket
#    number, or explaining a non-obvious dispatch rule) -- not restating
#    the following line.
# 2. "Long comment block" fired on two multi-paragraph comments that
#    reference specific issue numbers and explain non-obvious domain facts
#    (a sprite's drawn orientation, a GPS device's physical position in a
#    train) -- exactly the "good comment that happens to exceed the line
#    count" case gourmand's own guidance says to except rather than trim.
# ============================================================================

[[exceptions]]
check = "verbose_comments"
path = "backend/server.js"
justification = "Both hits match a truncated 'Validate a'/'UPDATE q' substring inside comments that explain a security fix (SSRF finding) and a query-avoidance optimization respectively -- not restating the following line"
classification = "gourmand_bug"

[[exceptions]]
check = "verbose_comments"
path = "backend/services/trainTrackerService.js"
justification = "Matches a truncated 'Validate t' substring inside a comment documenting testSharingToken's purpose and scope boundary (does not touch the live poller's state) -- not restating the following line"
classification = "gourmand_bug"

[[exceptions]]
check = "verbose_comments"
path = "frontend/src/App.jsx"
justification = "Matches a truncated 'Update d' substring inside a comment explaining the dispatch rule for the unified POI update/delete handler (spec 019) -- not restating the following line"
classification = "gourmand_bug"

[[exceptions]]
check = "verbose_comments"
path = "frontend/src/components/Map.jsx"
justification = "A 9-line comment (max 8) documenting why the CVSR locomotive sprite is drawn nose-up with a specific body footprint, referencing the bug (#533) it replaces -- a good comment that happens to exceed the line count, not filler"
classification = "gourmand_bug"

[[exceptions]]
check = "verbose_comments"
path = "frontend/src/utils/trainConsist.js"
justification = "An 11-line comment (max 8) documenting the physical consist order and why the GPS-tracked unit is not the lead engine (a real-world fact that broke #573 when assumed otherwise) -- a good comment that happens to exceed the line count, not filler"
classification = "gourmand_bug"

# ============================================================================
# console_log_production — hand-run CLI tools (issue #612)
#
# backend/migrations/*.js and backend/scripts/*.js are one-off operator tools
# run as `node /app/migrations/<name>.js` (see docs/RIVER_LEVELS_ARCHITECTURE.md).
# Verified: rotv-init.sh only executes migrations/[0-9]*.sql, and no server
# module imports either directory. Their stdout progress report IS the
# interface; the server code uses backend/utils/logger.js instead.
# ============================================================================

[[exceptions]]
check = "console_log_production"
path = "backend/migrations/*.js"
justification = "Hand-run operator CLI tools (node /app/migrations/<name>.js); rotv-init.sh runs only *.sql and no server module imports them — printing progress to stdout is their interface"
classification = "by_design"

[[exceptions]]
check = "console_log_production"
path = "backend/scripts/*.js"
justification = "Hand-run operator CLI tools (backfills, cleanup with --dry-run); not imported by the server — printing progress to stdout is their interface"
classification = "by_design"

[[exceptions]]
check = "console_log_bracket_tag_prefix"
path = "backend/migrations/*.js"
justification = "Same hand-run CLI tools as the console_log_production entry above; the bracket tag labels the phase in a one-shot terminal report, not a stand-in for a server logger"
classification = "by_design"
