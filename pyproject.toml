# rotv is mostly JavaScript, but it is not true that it "does not use Python
# tooling" -- that comment was written before image-server/ existed. There are
# 24 Python files here: a deployed service under image-server/ with its own
# pyproject.toml, plus loose scripts under data/ and scripts/.
#
# So this file does two jobs. The [tool.ruff] settings below are what
# `ruff check .` applies to those loose scripts (ruff's config is hierarchical,
# so files under image-server/ get ITS pyproject instead). And [tool.sdlc]
# below is how the repo is gated under constitution XII (v1.30.0).

[tool.ruff.lint]
select = ["PLR", "C901"]

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

# The Python the gate checks is image-server/, not this directory: that is where
# the [project] table, the dependencies and the tests are. mypy, pytest and
# pip-audit run there (python-sdlc >= v0.3.7). Everything repo-wide -- the
# constitution validator, Gourmand, Gatehouse, CodeQL and `ruff check .` --
# still runs from here.
[tool.sdlc]
repo-kinds = ["web-application"]
project = "image-server"
# The app is Node. Naming a stack turns off the python-only default a
# pyproject.toml implies; python still runs, for image-server/.
stacks = ["node"]

[tool.sdlc.push]
# No in-repo Semgrep rules: the check exits 2 when .semgrep is absent rather
# than scanning nothing and calling it a pass.
skip = ["semgrep"]

# The backend's tests need its database, so they run in the image
# (`backend` below). Lint is the root's: eslint and its plugins are root
# devDependencies, and its script lints frontend/ and backend/.
[tool.sdlc.push.npm-test]
packages = ["frontend"]

[tool.sdlc.push.npm-lint]
packages = ["."]

[tool.sdlc.push.npm-audit]
packages = [".", "frontend", "backend"]

# What tests.yml ran, as checks. The backend's tests run where it runs: the
# app image, built with its devDependencies, booted under systemd.
[tool.sdlc.ci]
# rotv-base and images-rotv install from RHSM, and `check` gets no secrets (a fork's
# PR runs it), so their builds and contracts are not listed here: the image job
# builds and boot-gates both, with the subscription, before it publishes them.
checks = [
  "containerfile-chains", "migration-tests", "migration-compat",
  "backend-image", "backend",
  "app-contract", "app-boot",
  "dev-image", "dev-contract",
]

[tool.sdlc.ci.containerfile-chains]
kind = "command"
argv = ["bash", "tests/image/lint-containerfiles.sh"]

[tool.sdlc.ci.migration-tests]
kind = "command"
argv = ["node", "--test", "tests/migrations/check-migrations.test.mjs"]

[tool.sdlc.ci.migration-compat]
kind = "command"
argv = ["bash", "tests/ci/check-migrations.sh"]

[tool.sdlc.ci.container-build]
tag = "localhost/rotv:ci"
build_args = { BASE_IMAGE = "quay.io/crunchtools/rotv-base:latest" }

[tool.sdlc.ci.backend-image]
kind = "image-build"
tag = "localhost/rotv:test"
build_args = { BASE_IMAGE = "quay.io/crunchtools/rotv-base:latest", BUILD_ENV = "test" }

# Ready once rotv-init has created the database. The backend cannot start
# until setup writes its environment file, and the seed is INSERT-only: the
# backend creates the schema on its first start, so it seeds after that.
[tool.sdlc.ci.backend]
kind = "command"
systemd = true
image = "localhost/rotv:test"
# The image installs Chromium as root at build time; the check runs with HOME=/tmp.
env = { PLAYWRIGHT_BROWSERS_PATH = "/root/.cache/ms-playwright" }
ready = ["systemctl", "is-active", "--quiet", "rotv-init"]
setup = [
  ["bash", "/repo/tests/ci/check-logging.sh"],
  ["bash", "/repo/tests/ci/write-environment.sh"],
  ["systemctl", "restart", "rotv-backend"],
  ["bash", "/repo/tests/ci/wait-for-api.sh"],
  ["psql", "-U", "postgres", "-d", "rotv", "-f", "/repo/backend/tests/fixtures/test-seed-data.sql"],
  ["bash", "/repo/tests/ci/apply-migrations.sh"],
  ["systemctl", "restart", "rotv-backend"],
  ["bash", "/repo/tests/ci/wait-for-api.sh"],
]
argv = ["npm", "--prefix", "/app", "test"]


# The image contracts and boot tests, run on what this run builds (the image
# job runs no boot-command: crunchtools/sdlc#118). contract.sh and boot.sh
# take --here to run inside the image rather than drive podman.
[tool.sdlc.ci.app-contract]
kind = "command"
image = "localhost/rotv:ci"
argv = ["bash", "tests/image/contract.sh", "--here", "app"]

[tool.sdlc.ci.app-boot]
kind = "command"
systemd = true
image = "localhost/rotv:ci"
ready = ["systemctl", "show", "--property=Version"]
setup = [
  ["bash", "/repo/tests/ci/write-environment.sh"],
  ["systemctl", "restart", "rotv-backend", "umami"],
]
argv = ["bash", "/repo/tests/image/boot.sh", "--here", "app"]

[tool.sdlc.ci.base-image]
kind = "image-build"
containerfile = "Containerfile.base"
tag = "localhost/rotv-base:ci"

[tool.sdlc.ci.base-contract]
kind = "command"
image = "localhost/rotv-base:ci"
argv = ["bash", "tests/image/contract.sh", "--here", "base"]

# FROM the published app image, as rotv-dev has always been built
[tool.sdlc.ci.dev-image]
kind = "image-build"
containerfile = "Containerfile.dev"
tag = "localhost/rotv-dev:ci"

[tool.sdlc.ci.dev-contract]
kind = "command"
image = "localhost/rotv-dev:ci"
argv = ["bash", "tests/image/contract.sh", "--here", "dev"]

[tool.sdlc.ci.images-image]
kind = "image-build"
containerfile = "Containerfile.images"
tag = "localhost/images-rotv:ci"

[tool.sdlc.ci.images-contract]
kind = "command"
image = "localhost/images-rotv:ci"
argv = ["bash", "tests/image/contract.sh", "--here", "images"]

[tool.sdlc.ci.images-boot]
kind = "command"
systemd = true
image = "localhost/images-rotv:ci"
ready = ["systemctl", "show", "--property=Version"]
argv = ["bash", "/repo/tests/image/boot.sh", "--here", "images"]

[tool.sdlc.image]
# Written by crunchtools/sdlc's scripts/convert_repo.py: moved from the workflows.
image = "quay.io/crunchtools/rotv"
build-args = "BASE_IMAGE=quay.io/crunchtools/rotv-base:latest\n"
rhsm = true
# Not rotv-backend or umami: they wait for /etc/rotv/environment, which the
# host mounts. Not rotv-display: a PR candidate is built without the
# entitlement, so it has no Weston (tests/image/display.expect).
boot = "systemd"
boot-units = "postgresql rotv-init"

[[tool.sdlc.images]]
name = "rotv-base"
containerfile = "Containerfile.base"
rhsm = true
boot = "systemd"
boot-units = "postgresql"

[[tool.sdlc.images]]
name = "rotv-dev"
containerfile = "Containerfile.dev"
boot = "none"
boot-none-reason = "its dev units run a mounted checkout the boot gate cannot give it; [tool.sdlc.ci] dev-contract checks what it ships"

[[tool.sdlc.images]]
name = "images-rotv"
containerfile = "Containerfile.images"
rhsm = true
boot = "systemd"
boot-units = "postgresql imageserver-db-init image-server"
