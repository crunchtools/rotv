name: Build and Push Container Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - 'image-server/**'
      - 'Containerfile.images'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'image-server/**'
      - 'Containerfile.images'
  repository_dispatch:
    # Fix: keep parent-image-updated; add rotv-base-updated from build-base (PR #627 review)
    types: [parent-image-updated, rotv-base-updated]
  workflow_dispatch:
env:
  REGISTRY: quay.io
  IMAGE_NAME: crunchtools/rotv
  GHCR_IMAGE: ghcr.io/crunchtools/rotv

jobs:
  build-and-push-quay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Fix: Dependabot runs only see the (empty) Dependabot secret store; build without login/push there
    env:
      HAS_QUAY: ${{ secrets.QUAY_USERNAME != '' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      pushed: ${{ steps.quay.outputs.pushed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Record whether this run can push
        id: quay
        run: echo "pushed=$HAS_QUAY" >> "$GITHUB_OUTPUT"

      - name: Log in to Quay.io
        if: env.HAS_QUAY == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Only immutable tags here. :latest and the semver tags move in the
          # promote job, after the image gate has passed on this digest.
          tags: |
            type=ref,event=pr
            type=sha,prefix=
          flavor: |
            latest=false

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: ${{ env.HAS_QUAY == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=quay.io/crunchtools/rotv-base:latest
          secrets: |
            activation_key=${{ secrets.RHSM_ACTIVATION_KEY }}
            org_id=${{ secrets.RHSM_ORG_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"


  # Separate from the constitution-mandated report-only Trivy step above:
  # this job needs security-events: write for SARIF, which build-and-push-quay
  # must not hold. Gates PRs; on push it only reports, since the image is already published.
  trivy-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: build-and-push-quay
    # No registry digest to scan when the quay job built without pushing (Dependabot runs)
    if: needs.build-and-push-quay.outputs.pushed == 'true'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan pushed image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push-quay.outputs.digest }}
          scanners: vuln
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy.sarif
          # Without this, trivy-action drops the severity filter for SARIF and gates on every severity
          limit-severities-for-sarif: true
          exit-code: ${{ github.event_name == 'pull_request' && '1' || '0' }}

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-rotv

  # The digest under test is the digest that ships
  image-gate:
    needs: build-and-push-quay
    if: needs.build-and-push-quay.outputs.pushed == 'true'
    uses: ./.github/workflows/image-gate.yml
    with:
      image: quay.io/crunchtools/rotv@${{ needs.build-and-push-quay.outputs.digest }}
      profile: app
      boot: true
    secrets: inherit

  # Copies the tested digest to :latest (default branch) or the semver tags
  # (v* tags) on Quay and GHCR. Nothing is rebuilt, so GHCR gets the same bytes.
  promote:
    runs-on: ubuntu-latest
    needs: [build-and-push-quay, image-gate]
    if: github.event_name != 'pull_request'
    # One promotion at a time; promote.sh keeps an older commit off :latest
    concurrency:
      group: promote-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Compute promoted tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
          # metadata-action's default latest=auto also tags semver builds as latest
          flavor: |
            latest=false

      - name: Promote tested digest
        env:
          SRC: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push-quay.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: tests/image/promote.sh "$SRC"
