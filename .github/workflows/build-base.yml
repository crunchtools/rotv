name: Build and Push Base Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - Containerfile.base
  repository_dispatch:
    types: [parent-image-updated]
  workflow_dispatch:

env:
  REGISTRY: quay.io
  IMAGE_NAME: crunchtools/rotv-base
  GHCR_IMAGE: ghcr.io/crunchtools/rotv-base

jobs:
  build-and-push-quay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile.base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # This workflow hand-rolls the OCI labels rather than using
          # docker/metadata-action's, so Section III's required labels stay
          # exact. image.source is what auto-links the GHCR package to the
          # repo and grants github.token write access to it. Tags now come
          # from metadata-action above (bare :latest plus, on a vX.Y.Z tag
          # push, the matching semver tags) so a release tag actually lands
          # a versioned rotv-base image alongside :latest.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Base image for rootsofthevalley.org
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
          secrets: |
            activation_key=${{ secrets.RHSM_ACTIVATION_KEY }}
            org_id=${{ secrets.RHSM_ORG_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      # Fix: build-base.yml itself listens for parent-image-updated, so sending
      # that event here re-triggered build-base forever (PR #627 review).
      - name: Trigger rotv rebuild
        env:
          GH_TOKEN: ${{ secrets.CRUNCHTOOLS_DISPATCH_TOKEN }}
        run: |
          gh api repos/crunchtools/rotv/dispatches \
            -f event_type=rotv-base-updated

  build-and-push-ghcr:
    runs-on: ubuntu-latest
    needs: build-and-push-quay
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile.base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Base image for rootsofthevalley.org
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
          secrets: |
            activation_key=${{ secrets.RHSM_ACTIVATION_KEY }}
            org_id=${{ secrets.RHSM_ORG_ID }}
          cache-from: type=gha
