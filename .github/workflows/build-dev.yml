name: Build and Push Dev Image

# quay.io/crunchtools/rotv-dev: the app image plus git, gh and Claude Code, for
# dev.rootsofthevalley.org. Rebuilt whenever the app image is.
on:
  push:
    branches: [main, master]
    paths:
      - Containerfile.dev
      - 'rootfs-dev/**'
      - .github/workflows/build-dev.yml
  pull_request:
    branches: [main, master]
    paths:
      - Containerfile.dev
      - 'rootfs-dev/**'
      - .github/workflows/build-dev.yml
  workflow_run:
    workflows: ["Build and Push Container Image"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: quay.io
  IMAGE_NAME: crunchtools/rotv-dev
  GHCR_IMAGE: ghcr.io/crunchtools/rotv-dev

jobs:
  build-and-push-quay:
    runs-on: ubuntu-latest
    # A failed app build leaves nothing new to build on
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile.dev
          # The app image moves under this one, so its layers are never a cache hit
          pull: true
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=rotv-dev
          cache-to: type=gha,scope=rotv-dev,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Hosted development image for rootsofthevalley.org
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        if: env.PUSH == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  build-and-push-ghcr:
    runs-on: ubuntu-latest
    needs: build-and-push-quay
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile.dev
          pull: true
          push: true
          tags: ${{ env.GHCR_IMAGE }}:latest
          cache-from: type=gha,scope=rotv-dev
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Hosted development image for rootsofthevalley.org
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
