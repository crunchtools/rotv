name: Build and Push Dev Image

# quay.io/crunchtools/rotv-dev: the app image plus the units that run a mounted
# checkout, for dev.rootsofthevalley.org. Rebuilt whenever the app image is.
on:
  push:
    branches: [main, master]
    paths:
      - Containerfile.dev
      - 'rootfs-dev/**'
      - scripts/test-rotv-dev-kick.sh
      - .github/workflows/build-dev.yml
  pull_request:
    branches: [main, master]
    paths:
      - Containerfile.dev
      - 'rootfs-dev/**'
      - scripts/test-rotv-dev-kick.sh
      - .github/workflows/build-dev.yml
  workflow_run:
    workflows: ["Build and Push Container Image"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: quay.io
  IMAGE_NAME: crunchtools/rotv-dev
  GHCR_IMAGE: ghcr.io/crunchtools/rotv-dev

jobs:
  build-and-push-quay:
    runs-on: ubuntu-latest
    # A failed app build leaves nothing new to build on
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile.dev
          # The app image moves under this one, so its layers are never a cache hit
          pull: true
          push: ${{ env.PUSH == 'true' }}
          # :latest moves in promote, after the gate
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=rotv-dev
          cache-to: type=gha,scope=rotv-dev,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=rotv-dev
            org.opencontainers.image.description=Hosted development image for rootsofthevalley.org
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        if: env.PUSH == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  image-gate:
    needs: build-and-push-quay
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/image-gate.yml
    with:
      image: quay.io/crunchtools/rotv-dev@${{ needs.build-and-push-quay.outputs.digest }}
      profile: dev
      boot: false
    secrets: inherit

  # Copies the tested digest to :latest on Quay and GHCR. Nothing is rebuilt.
  promote:
    runs-on: ubuntu-latest
    needs: [build-and-push-quay, image-gate]
    if: github.event_name != 'pull_request'
    concurrency:
      group: promote-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Compute promoted tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
          flavor: |
            latest=false

      - name: Promote tested digest
        env:
          SRC: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push-quay.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: tests/image/promote.sh "$SRC"
