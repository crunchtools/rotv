# Container release (constitution III, Container Image VII): build once per
# change, gate the digest with tests/image/contract.sh and boot.sh, promote
# what was tested by digest copy. Quay.io only. :latest moves on a v* tag only.

name: Container

on:
  pull_request:
    paths-ignore: ['image-server/**', Containerfile.images]
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore: ['image-server/**', Containerfile.images]
  repository_dispatch:
    # rotv-base was promoted (ubi10-core's parent-image-updated rebuilds the base).
    types: [rotv-base-updated]
  workflow_dispatch:

permissions: {}

jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.51.0
    permissions:
      contents: read
      issues: write   # the alert job files a failed schedule as an issue
      pull-requests: read
    with:
      image: quay.io/crunchtools/rotv
      default-branch: master
      build-args: |
        BASE_IMAGE=quay.io/crunchtools/rotv-base:latest
      rhsm: true
      boot: command
      boot-command: tests/image/contract.sh "$IMAGE" app && tests/image/boot.sh "$IMAGE" app
      # Hosts refuse an unsigned quay.io/crunchtools image
      # (crunchtools/rhel10-bootc-server#47). Promote signs the gated digest
      # before any tag moves, with the key from this repo's cosign-signing
      # environment (master and v* only); without it promote refuses.
      sign: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      RHSM_ACTIVATION_KEY: ${{ secrets.RHSM_ACTIVATION_KEY }}
      RHSM_ORG_ID: ${{ secrets.RHSM_ORG_ID }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
