# container-scan's accepted findings (sdlc mounts this repo, so grype reads it).
#
# a1546: these three sit in Umami's Prisma install under /opt/umami, which comes
# from rotv-base, not from this repo's lockfiles. Containerfile.base now installs
# prisma 7.10.1 and floors effect, which clears all three, but a pull request
# builds FROM quay.io/crunchtools/rotv-base:latest, and the base is only rebuilt
# by the image job after merge. Each rule names the exact vulnerable version, so
# it matches nothing once the rebuilt base ships. Delete this file then.
ignore:
  - vulnerability: GHSA-ggr8-5vv4-36mx
    package: { name: deepmerge-ts, version: 7.1.5, location: "/opt/umami/**" }
  - vulnerability: GHSA-7589-6fvf-x4pw
    package: { name: effect, version: 3.20.0, location: "/opt/umami/**" }
  - vulnerability: GHSA-3f6p-5ww8-9rcr
    package: { name: mysql2, version: 3.15.3, location: "/opt/umami/**" }
