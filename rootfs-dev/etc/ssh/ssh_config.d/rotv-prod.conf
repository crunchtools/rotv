# `ssh rotv-prod deploy` from the dev container. The key lives on the state
# volume (/root does not survive a restart) and the production host lets it run
# deploy/rotv-deploy.sh and nothing else.
Host rotv-prod
    HostName lotor.dc3.crunchtools.com
    Port 22422
    User root
    IdentityFile /var/lib/rotv-dev/ssh/id_ed25519
    IdentitiesOnly yes
    UserKnownHostsFile /var/lib/rotv-dev/ssh/known_hosts
    StrictHostKeyChecking yes
    BatchMode yes
