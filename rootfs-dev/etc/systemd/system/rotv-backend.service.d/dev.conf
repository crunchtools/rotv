[Unit]
After=rotv-dev-deps.service
Requires=rotv-dev-deps.service

[Service]
# /app is the checkout here and has no built frontend. The one the image was
# built with serves the few backend routes that read index.html.
Environment=STATIC_PATH=/opt/rotv-image/public
# Whoever edits the checkout has no shell in this container, so the backend
# restarts itself when a file it loaded changes. A save that does not parse
# leaves node waiting for the next one, not the unit failed.
ExecStart=
ExecStart=/usr/bin/node --watch --watch-preserve-output /app/server.js
