# Gourmand Configuration
# AI slop detection for maintaining code quality
# See https://codeberg.org/mattdm/gourmand for documentation

[global]
# Paths to exclude from all checks
excluded_paths = [
    ".specify/**",
    "docs/**",
    "frontend/dist/**",
    "node_modules/**",
    ".git/**",
    "*.min.js",
    "*.min.css",
    # Backend test scripts are manual debugging utilities
    "backend/test-*.js",
    # Image server is a Python project with its own lint tooling (ruff, mypy)
    "image-server/**",
    "image-server/**/*",
    "Containerfile.images",
    # Untracked boundary data scripts (one-off GeoJSON generators, not part of the app)
    "data/**",
]

[checks]
# Disable checks that don't apply to JavaScript/Node.js projects
linter_configuration = false  # Expects clippy.toml (Rust) or pyproject.toml (Python)
implicit_state_machine = false  # Rust-centric check; false-positives on Python type annotations and React idioms like isLoading/isOpen
# These false-positive on standard JS/React/HTML idioms (confirmed during the
# #184 sidebar extraction, which relocated pre-existing gourmand-clean code):
deferred_work = false  # Matches "todo" inside "Mastodon" and HTML placeholder="..." attributes
lint_suppression = false  # Flags intentional `eslint-disable-next-line react-hooks/exhaustive-deps`
verbose_comments = false  # Counts single-line eslint-disable directives as comment blocks (max 0 on new files)

[[check_overrides]]
check = "linter_configuration"
justification = "Expects clippy.toml (Rust) or pyproject.toml (Python) — this is a JavaScript/Node.js project linted by eslint with eslint.config.js, a configuration shape the check does not recognize"
classification = "gourmand_bug"

[[check_overrides]]
check = "implicit_state_machine"
justification = "Rust-centric check that false-positives on Python type annotations (str, int, bool) and standard React boolean-state idioms like isLoading/isOpen, which are not implicit state machines"
classification = "gourmand_bug"

[[check_overrides]]
check = "deferred_work"
justification = "Matches 'todo' inside the substring 'Mastodon' and HTML placeholder=\"...\" attributes on form inputs — standard JS/React/HTML idioms, not deferred-work markers (confirmed during the #184 sidebar extraction, which relocated pre-existing gourmand-clean code)"
classification = "gourmand_bug"

[[check_overrides]]
check = "lint_suppression"
justification = "Project policy permits eslint-disable-next-line react-hooks/exhaustive-deps suppressions when each carries an adjacent WHY-comment naming the excluded reference — the documented suppressions are deliberate dependency-array decisions, not hidden lint debt"
classification = "by_design"

[[check_overrides]]
check = "verbose_comments"
justification = "Counts single-line eslint-disable directives as comment blocks against a max-0 budget on new files, flagging files whose only comments are required lint markers"
classification = "gourmand_bug"

[severity]
# Override severity levels for specific checks
# check_name = "warning"  # Options: error, warning, info

[output]
# Output format options
format = "text"  # Options: text, json, github
color = true

# Gourmand ships these defaults, but only applies them when no gourmand.toml
# exists. With a config file present and no [thresholds] table, every value
# silently becomes 0 — so a one-line comment trips a rule documented as firing
# at nine, and checks with a minimum size stop firing at all. Restated here
# verbatim from the binary's built-in defaults so the config file does not
# change what the checks mean.
[thresholds]
max_cognitive_complexity_error = 100
max_cognitive_complexity_warning = 50
max_comment_block_lines = 8
max_comment_ratio_percent = 40
min_function_body_lines = 3
max_elif_branches = 2
min_state_branches = 4
min_boolean_flags = 3
copy_paste_same_file_threshold = 0.8
copy_paste_across_files_threshold = 0.9
copy_paste_min_complexity = 5
copy_paste_min_statements = 3
copy_paste_min_length_ratio = 0.5
copy_paste_levenshtein_weight = 0.5
copy_paste_jaro_winkler_weight = 0.3
copy_paste_token_set_weight = 0.2
copy_paste_fingerprint_boost = 0.1
copy_paste_fingerprint_penalty = 0.1
copy_paste_exact_match_threshold = 0.95
copy_paste_small_function_size = 9
copy_paste_small_function_min_statements = 3
copy_paste_large_function_min_statements = 12
copy_paste_small_function_threshold = 0.99
copy_paste_exempt_tests = true
copy_paste_exempt_constructors = true
