# Gourmand Configuration
# AI slop detection for maintaining code quality
# See https://gitlab.com/mattdm/gourmand for documentation

[global]
# Paths to exclude from all checks
excluded_paths = [
    ".specify/**",
    "docs/**",
    "frontend/dist/**",
    "node_modules/**",
    ".git/**",
    "*.min.js",
    "*.min.css",
    # Backend test scripts are manual debugging utilities
    "backend/test-*.js",
    # Image server is a Python project with its own lint tooling (ruff, mypy)
    "image-server/**",
    "image-server/**/*",
    "Containerfile.images",
    # Untracked boundary data scripts (one-off GeoJSON generators, not part of the app)
    "data/**",
]

[checks]
# Disable checks that don't apply to JavaScript/Node.js projects.
#
# linter_configuration, implicit_state_machine, and deferred_work were
# previously disabled here too. Tested on 0.16.5 with the disable removed:
# implicit_state_machine and deferred_work fired zero times (their upstream
# false-positive patterns are apparently fixed) and were deleted outright.
# linter_configuration's one real violation was a genuinely missing
# [tool.ruff.lint.mccabe] threshold in the placeholder pyproject.toml (kept
# solely to give gourmand a config file to find on this JS project); fixed
# directly instead of re-disabling the check.
lint_suppression = false  # verified below: every suppression covered by this
                          # override carries an adjacent WHY-comment

[[check_overrides]]
check = "lint_suppression"
justification = "Project policy permits eslint-disable-next-line react-hooks/exhaustive-deps suppressions when each carries an adjacent WHY-comment naming the excluded reference — verified all 8 current sites carry one; the documented suppressions are deliberate dependency-array decisions, not hidden lint debt"
classification = "by_design"

[severity]
# Override severity levels for specific checks
# check_name = "warning"  # Options: error, warning, info

[output]
# Output format options
format = "text"  # Options: text, json, github
color = true
